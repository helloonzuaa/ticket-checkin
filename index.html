<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Ticket Check-In</title>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border-radius: 12px;

      overflow: hidden;

    }


    #startButton {

      display: block;

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      padding: 16px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

    }


    #result {

      margin: 20px auto;

      padding: 20px;

      max-width: 500px;

      background: white;

      border-radius: 12px;

      font-size: 20px;

    }


    .waiting {

      color: #555;

    }


    .valid {

      color: green;

    }


    .invalid {

      color: red;

    }


    .duplicate {

      color: orange;

    }

  </style>

</head>


<body>


  <h1>🎟️ E-Ticket Check-In</h1>


  <p>

    Scan the QR Code on the E-Ticket

  </p>


  <button id="startButton"
          onclick="startScanner()">

    📷 Start Scanner

  </button>


  <div id="reader"></div>


  <div id="result"
       class="waiting">

    Press "Start Scanner" to begin.

  </div>


  <!-- QR Scanner -->

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>


  <script>


    // ==========================================
    // YOUR APPS SCRIPT WEB APP
    // ==========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzF3QDGBVMbo_deaAJLfmtNz1ia8Dbi-blqC4xmH0r2sPlSbT6WGQJYrrSjabU0JCPlfw/exec";


    let scanner = null;

    let scannerRunning = false;


    // ==========================================
    // START SCANNER
    // ==========================================

    function startScanner() {


      if (scannerRunning) {

        return;

      }


      document.getElementById("result")
        .className = "waiting";


      document.getElementById("result")
        .innerHTML =
        "Requesting camera access...";


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        function(decodedText) {


          if (!scannerRunning) {

            return;

          }


          scannerRunning = false;


          scanner.stop()

            .then(function() {

              checkTicket(
                decodedText
              );

            })

            .catch(function() {

              checkTicket(
                decodedText
              );

            });

        }

      )

      .then(function() {


        scannerRunning = true;


        document.getElementById(
          "startButton"
        ).style.display = "none";


        document.getElementById(
          "result"
        ).className = "waiting";


        document.getElementById(
          "result"
        ).innerHTML =

          "📷 Camera ready." +

          "<br><br>" +

          "Point the camera at the QR Code.";

      })


      .catch(function(error) {


        scannerRunning = false;


        document.getElementById(
          "result"
        ).className = "invalid";


        document.getElementById(
          "result"
        ).innerHTML =

          "❌ Unable to access camera." +

          "<br><br>" +

          "<small>" +

          String(error) +

          "</small>";

      });

    }


    // ==========================================
    // SEND TICKET TO GOOGLE APPS SCRIPT
    // ==========================================

    function checkTicket(ticketNumber) {

  const resultBox =
    document.getElementById("result");

  resultBox.className = "waiting";

  resultBox.innerHTML =
    "🔍 Checking ticket..." +
    "<br><br>" +
    "<strong>" +
    ticketNumber +
    "</strong>";

  const callbackName =
    "ticketCallback_" +
    Date.now();

  let finished = false;
  let timeoutId = null;

  // ==========================================
  // JSONP CALLBACK
  // ==========================================

  window[callbackName] = function(result) {

    console.log(
      "JSONP CALLBACK RECEIVED:",
      result
    );

    if (finished) {
      return;
    }

    finished = true;

    if (timeoutId) {
      clearTimeout(timeoutId);
    }

    displayResult(result);

    delete window[callbackName];

    if (
      script &&
      script.parentNode
    ) {
      script.parentNode.removeChild(script);
    }

  };


  // ==========================================
  // CREATE SCRIPT
  // ==========================================

  const script =
    document.createElement("script");

  const requestUrl =
    SCRIPT_URL +
    "?ticket=" +
    encodeURIComponent(
      String(ticketNumber).trim()
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();

  console.log(
    "REQUEST URL:",
    requestUrl
  );


  script.src = requestUrl;

  script.type =
    "text/javascript";

  script.async = false;


  // ==========================================
  // SCRIPT LOADED
  // ==========================================

  script.onload = function() {

    console.log(
      "Apps Script response loaded."
    );

    /*
     * IMPORTANT:
     *
     * JSONP should call window[callbackName].
     *
     * If onload happens but callback
     * has not executed, wait for timeout.
     */

  };


  // ==========================================
  // SCRIPT ERROR
  // ==========================================

  script.onerror = function(error) {

    console.error(
      "JSONP SCRIPT ERROR:",
      error
    );

    if (finished) {
      return;
    }

    finished = true;

    if (timeoutId) {
      clearTimeout(timeoutId);
    }

    delete window[callbackName];

    displayError(
      "API CONNECTION ERROR"
    );

    if (
      script.parentNode
    ) {
      script.parentNode.removeChild(
        script
      );
    }

  };


  // ==========================================
  // TIMEOUT
  // ==========================================

  timeoutId = setTimeout(
    function() {

      if (finished) {
        return;
      }

      finished = true;

      console.error(
        "JSONP TIMEOUT"
      );

      delete window[callbackName];

      displayError(
        "API TIMEOUT"
      );

      if (
        script.parentNode
      ) {
        script.parentNode.removeChild(
          script
        );
      }

    },
    15000
  );


  // ==========================================
  // SEND REQUEST
  // ==========================================

  document.head.appendChild(
    script
  );

}


    // ==========================================
    // DISPLAY RESULT
    // ==========================================

    function displayResult(result) {


      const resultBox =
        document.getElementById(
          "result"
        );


      // ========================================
      // VALID
      // ========================================

      if (
        result.status ===
        "VALID"
      ) {


        resultBox.className =
          "valid";


        resultBox.innerHTML =

          "✅ VALID TICKET" +

          "<br><br>" +

          "<strong>" +

          result.ticketNumber +

          "</strong>" +

          "<br><br>" +

          result.name +

          "<br>" +

          result.ticketType +

          "<br><br>" +

          "<strong>CHECKED IN</strong>";

      }


      // ========================================
      // ALREADY CHECKED IN
      // ========================================

      else if (
        result.status ===
        "ALREADY_CHECKED_IN"
      ) {


        resultBox.className =
          "duplicate";


        resultBox.innerHTML =

          "⚠️ ALREADY CHECKED IN" +

          "<br><br>" +

          "<strong>" +

          result.ticketNumber +

          "</strong>" +

          "<br><br>" +

          result.name +

          "<br>" +

          result.ticketType +

          "<br><br>" +

          "First check-in:" +

          "<br>" +

          result.checkInTime;

      }


      // ========================================
      // INVALID
      // ========================================

      else {


        resultBox.className =
          "invalid";


        resultBox.innerHTML =

          "❌ INVALID TICKET" +

          "<br><br>" +

          "<strong>" +

          (
            result.ticketNumber ||
            "UNKNOWN"
          ) +

          "</strong>";

      }


      // ========================================
      // SCAN NEXT
      // ========================================

      document.getElementById(
        "startButton"
      ).style.display = "block";


      document.getElementById(
        "startButton"
      ).innerHTML =

        "📷 Scan Next Ticket";

    }


    // ==========================================
    // ERROR
    // ==========================================

    function displayError(error) {


      document.getElementById(
        "result"
      ).className = "invalid";


      document.getElementById(
        "result"
      ).innerHTML =

        "❌ SYSTEM ERROR" +

        "<br><br>" +

        "<small>" +

        String(error) +

        "</small>";


      document.getElementById(
        "startButton"
      ).style.display = "block";


      document.getElementById(
        "startButton"
      ).innerHTML =

        "📷 Try Again";

    }


  </script>


</body>

</html>
