<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Ticket Check-In</title>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border-radius: 12px;

      overflow: hidden;

    }


    #startButton {

      display: block;

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      padding: 16px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

    }


    #result {

      margin: 20px auto;

      padding: 20px;

      max-width: 500px;

      background: white;

      border-radius: 12px;

      font-size: 20px;

    }


    .waiting {

      color: #555;

    }


    .valid {

      color: green;

    }


    .invalid {

      color: red;

    }


    .duplicate {

      color: orange;

    }

  </style>

</head>


<body>


  <h1>🎟️ E-Ticket Check-In</h1>


  <p>

    Scan the QR Code on the E-Ticket

  </p>


  <button id="startButton"
          onclick="startScanner()">

    📷 Start Scanner

  </button>


  <div id="reader"></div>


  <div id="result"
       class="waiting">

    Press "Start Scanner" to begin.

  </div>


  <!-- QR Scanner -->

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>


  <script>


    // ==========================================
    // YOUR APPS SCRIPT WEB APP
    // ==========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzF3QDGBVMbo_deaAJLfmtNz1ia8Dbi-blqC4xmH0r2sPlSbT6WGQJYrrSjabU0JCPlfw/exec";


    let scanner = null;

    let scannerRunning = false;


    // ==========================================
    // START SCANNER
    // ==========================================

    function startScanner() {


      if (scannerRunning) {

        return;

      }


      document.getElementById("result")
        .className = "waiting";


      document.getElementById("result")
        .innerHTML =
        "Requesting camera access...";


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        function(decodedText) {


          if (!scannerRunning) {

            return;

          }


          scannerRunning = false;


          scanner.stop()

            .then(function() {

              checkTicket(
                decodedText
              );

            })

            .catch(function() {

              checkTicket(
                decodedText
              );

            });

        }

      )

      .then(function() {


        scannerRunning = true;


        document.getElementById(
          "startButton"
        ).style.display = "none";


        document.getElementById(
          "result"
        ).className = "waiting";


        document.getElementById(
          "result"
        ).innerHTML =

          "📷 Camera ready." +

          "<br><br>" +

          "Point the camera at the QR Code.";

      })


      .catch(function(error) {


        scannerRunning = false;


        document.getElementById(
          "result"
        ).className = "invalid";


        document.getElementById(
          "result"
        ).innerHTML =

          "❌ Unable to access camera." +

          "<br><br>" +

          "<small>" +

          String(error) +

          "</small>";

      });

    }


    // ==========================================
    // SEND TICKET TO GOOGLE APPS SCRIPT
    // ==========================================

    function checkTicket(ticketNumber) {


      document.getElementById(
        "result"
      ).className = "waiting";


      document.getElementById(
        "result"
      ).innerHTML =

        "🔍 Checking ticket..." +

        "<br><br>" +

        "<strong>" +

        ticketNumber +

        "</strong>";


 const callbackName =
  "ticketCallback_" + Date.now();

let finished = false;

window[callbackName] = function(result) {

  if (finished) return;

  finished = true;

  clearTimeout(timeout);

  console.log("Apps Script response:", result);

  displayResult(result);

  delete window[callbackName];

  if (script.parentNode) {
    script.parentNode.removeChild(script);
  }
};

const script =
  document.createElement("script");

script.src =
  SCRIPT_URL +
  "?ticket=" +
  encodeURIComponent(ticketNumber) +
  "&callback=" +
  callbackName +
  "&_=" +
  Date.now();

script.onload = function() {

  console.log(
    "Apps Script script loaded."
  );

};

script.onerror = function() {

  if (finished) return;

  finished = true;

  clearTimeout(timeout);

  console.error(
    "Apps Script JSONP request failed."
  );

  delete window[callbackName];

  displayError(
    "API CONNECTION ERROR"
  );

  if (script.parentNode) {
    script.parentNode.removeChild(script);
  }
};

const timeout = setTimeout(function() {

  if (finished) return;

  finished = true;

  console.error(
    "Apps Script response timeout."
  );

  delete window[callbackName];

  displayError(
    "API TIMEOUT"
  );

  if (script.parentNode) {
    script.parentNode.removeChild(script);
  }

}, 10000);

document.body.appendChild(script);

    }


    // ==========================================
    // DISPLAY RESULT
    // ==========================================

    function displayResult(result) {


      const resultBox =
        document.getElementById(
          "result"
        );


      // ========================================
      // VALID
      // ========================================

      if (
        result.status ===
        "VALID"
      ) {


        resultBox.className =
          "valid";


        resultBox.innerHTML =

          "✅ VALID TICKET" +

          "<br><br>" +

          "<strong>" +

          result.ticketNumber +

          "</strong>" +

          "<br><br>" +

          result.name +

          "<br>" +

          result.ticketType +

          "<br><br>" +

          "<strong>CHECKED IN</strong>";

      }


      // ========================================
      // ALREADY CHECKED IN
      // ========================================

      else if (
        result.status ===
        "ALREADY_CHECKED_IN"
      ) {


        resultBox.className =
          "duplicate";


        resultBox.innerHTML =

          "⚠️ ALREADY CHECKED IN" +

          "<br><br>" +

          "<strong>" +

          result.ticketNumber +

          "</strong>" +

          "<br><br>" +

          result.name +

          "<br>" +

          result.ticketType +

          "<br><br>" +

          "First check-in:" +

          "<br>" +

          result.checkInTime;

      }


      // ========================================
      // INVALID
      // ========================================

      else {


        resultBox.className =
          "invalid";


        resultBox.innerHTML =

          "❌ INVALID TICKET" +

          "<br><br>" +

          "<strong>" +

          (
            result.ticketNumber ||
            "UNKNOWN"
          ) +

          "</strong>";

      }


      // ========================================
      // SCAN NEXT
      // ========================================

      document.getElementById(
        "startButton"
      ).style.display = "block";


      document.getElementById(
        "startButton"
      ).innerHTML =

        "📷 Scan Next Ticket";

    }


    // ==========================================
    // ERROR
    // ==========================================

    function displayError(error) {


      document.getElementById(
        "result"
      ).className = "invalid";


      document.getElementById(
        "result"
      ).innerHTML =

        "❌ SYSTEM ERROR" +

        "<br><br>" +

        "<small>" +

        String(error) +

        "</small>";


      document.getElementById(
        "startButton"
      ).style.display = "block";


      document.getElementById(
        "startButton"
      ).innerHTML =

        "📷 Try Again";

    }


  </script>


</body>

</html>
