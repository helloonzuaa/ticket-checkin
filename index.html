<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Ticket Check-In</title>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border-radius: 12px;

      overflow: hidden;

    }


    #startButton {

      display: block;

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      padding: 16px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

    }


    #result {

      margin: 20px auto;

      padding: 20px;

      max-width: 500px;

      background: white;

      border-radius: 12px;

      font-size: 20px;

    }


    .waiting {

      color: #555;

    }


    .invalid {

      color: red;

    }

  </style>

</head>


<body>


  <h1>🎟️ E-Ticket Check-In</h1>


  <p>
    Scan the QR Code on the E-Ticket
  </p>


  <button
    id="startButton"
    onclick="startScanner()">

    📷 Start Scanner

  </button>


  <div id="reader"></div>


  <div
    id="result"
    class="waiting">

    Press "Start Scanner" to begin.

  </div>


  <!-- ========================================
       QR SCANNER
       ======================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // ==========================================
    // GOOGLE APPS SCRIPT WEB APP
    // ==========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzF3QDGBVMbo_deaAJLfmtNz1ia8Dbi-blqC4xmH0r2sPlSbT6WGQJYrrSjabU0JCPlfw/exec";


    let scanner = null;

    let scannerRunning = false;


    // ==========================================
    // START SCANNER
    // ==========================================

    function startScanner() {


      if (scannerRunning) {

        return;

      }


      document.getElementById(
        "result"
      ).className = "waiting";


      document.getElementById(
        "result"
      ).innerHTML =

        "Requesting camera access...";


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        function(decodedText) {


          if (!scannerRunning) {

            return;

          }


          scannerRunning = false;


          scanner.stop()

            .then(function() {

              checkTicket(
                decodedText
              );

            })

            .catch(function() {

              checkTicket(
                decodedText
              );

            });

        }

      )


      .then(function() {


        scannerRunning = true;


        document.getElementById(
          "startButton"
        ).style.display = "none";


        document.getElementById(
          "result"
        ).className = "waiting";


        document.getElementById(
          "result"
        ).innerHTML =

          "📷 Camera ready." +

          "<br><br>" +

          "Point the camera at the QR Code.";

      })


      .catch(function(error) {


        scannerRunning = false;


        document.getElementById(
          "result"
        ).className = "invalid";


        document.getElementById(
          "result"
        ).innerHTML =

          "❌ Unable to access camera." +

          "<br><br>" +

          "<small>" +

          String(error) +

          "</small>";

      });

    }


    // ==========================================
    // CHECK TICKET
    // ==========================================

    function checkTicket(ticketNumber) {


      const resultBox =
        document.getElementById(
          "result"
        );


      resultBox.className =
        "waiting";


      resultBox.innerHTML =

        "🔍 Checking ticket..." +

        "<br><br>" +

        "<strong>" +

        ticketNumber +

        "</strong>";


      const url =

        SCRIPT_URL +

        "?ticket=" +

        encodeURIComponent(
          String(ticketNumber).trim()
        );


      // ========================================
      // OPEN APPS SCRIPT RESULT PAGE
      // ========================================

      window.location.href = url;

    }


  </script>


</body>

</html>
