<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Ticket Check-In</title>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border-radius: 12px;

      overflow: hidden;

    }


    #startButton {

      display: block;

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      padding: 16px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

    }


    #result {

      margin: 20px auto;

      padding: 20px;

      max-width: 500px;

      background: white;

      border-radius: 12px;

      font-size: 20px;

    }


    .waiting {

      color: #555;

    }


    .valid {

      color: green;

    }


    .already {

      color: orange;

    }


    .invalid {

      color: red;

    }


    .resultButton {

      margin-top: 20px;

      padding: 15px 25px;

      font-size: 18px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

    }


  </style>

</head>


<body>


  <h1>🎟️ E-Ticket Check-In</h1>


  <p>
    Scan the QR Code on the E-Ticket
  </p>


  <button
    id="startButton"
    onclick="startScanner()">

    📷 Start Scanner

  </button>


  <div id="reader"></div>


  <div
    id="result"
    class="waiting">

    Press "Start Scanner" to begin.

  </div>


  <!-- ========================================
       QR SCANNER
       ======================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // ==========================================
    // GOOGLE APPS SCRIPT WEB APP
    // ==========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzF3QDGBVMbo_deaAJLfmtNz1ia8Dbi-blqC4xmH0r2sPlSbT6WGQJYrrSjabU0JCPlfw/exec";


    let scanner = null;

    let scannerRunning = false;


    // ==========================================
    // START SCANNER
    // ==========================================

    function startScanner() {


      if (scannerRunning) {

        return;

      }


      document.getElementById(
        "result"
      ).className = "waiting";


      document.getElementById(
        "result"
      ).innerHTML =

        "Requesting camera access...";


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        function(decodedText) {


          if (!scannerRunning) {

            return;

          }


          scannerRunning = false;


          scanner.stop()

            .then(function() {

              checkTicket(
                decodedText
              );

            })

            .catch(function() {

              checkTicket(
                decodedText
              );

            });

        }

      )


      .then(function() {


        scannerRunning = true;


        document.getElementById(
          "startButton"
        ).style.display = "none";


        document.getElementById(
          "result"
        ).className = "waiting";


        document.getElementById(
          "result"
        ).innerHTML =

          "📷 Camera ready." +

          "<br><br>" +

          "Point the camera at the QR Code.";

      })


      .catch(function(error) {


        scannerRunning = false;


        document.getElementById(
          "startButton"
        ).style.display = "block";


        document.getElementById(
          "result"
        ).className = "invalid";


        document.getElementById(
          "result"
        ).innerHTML =

          "❌ Unable to access camera." +

          "<br><br>" +

          "<small>" +

          String(error) +

          "</small>";

      });

    }


    // ==========================================
    // CHECK TICKET USING JSONP
    // ==========================================

    function checkTicket(ticketNumber) {


      const resultBox =
        document.getElementById(
          "result"
        );


      resultBox.className =
        "waiting";


      resultBox.innerHTML =

        "🔍 Checking ticket..." +

        "<br><br>" +

        "<strong>" +

        ticketNumber +

        "</strong>";


      const callbackName =
        "ticketCheckCallback";


      window[callbackName] =
        function(result) {


          displayResult(result);


          delete window[callbackName];


          if (script) {

            script.remove();

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =

        SCRIPT_URL +

        "?ticket=" +

        encodeURIComponent(
          String(ticketNumber).trim()
        ) +

        "&callback=" +

        callbackName;


      script.onerror =
        function() {


          resultBox.className =
            "invalid";


          resultBox.innerHTML =

            "❌ API CONNECTION ERROR" +

            "<br><br>" +

            "Unable to connect to ticket system.";


          delete window[callbackName];


          script.remove();

        };


      document.body.appendChild(
        script
      );

    }


    // ==========================================
    // DISPLAY RESULT
    // ==========================================

    function displayResult(result) {


      const resultBox =
        document.getElementById(
          "result"
        );


      // ========================================
      // VALID
      // ========================================

      if (
        result.status === "VALID"
      ) {


        resultBox.className =
          "valid";


        resultBox.innerHTML =

          "✅ VALID TICKET" +

          "<br><br>" +

          "<strong>" +

          result.ticketNumber +

          "</strong>" +

          "<br><br>" +

          result.name +

          "<br>" +

          result.ticketType +

          "<br><br>" +

          "<strong>" +

          "CHECKED IN" +

          "</strong>" +

          "<br><br>" +

          "<button" +

          " class=\"resultButton\"" +

          " onclick=\"scanNextTicket()\"" +

          ">" +

          "📷 SCAN NEXT TICKET" +

          "</button>";


        return;

      }


      // ========================================
      // ALREADY CHECKED IN
      // ========================================

      if (
        result.status ===
        "ALREADY_CHECKED_IN"
      ) {


        resultBox.className =
          "already";


        resultBox.innerHTML =

          "⚠️ ALREADY CHECKED IN" +

          "<br><br>" +

          "<strong>" +

          result.ticketNumber +

          "</strong>" +

          "<br><br>" +

          result.name +

          "<br>" +

          result.ticketType +

          "<br><br>" +

          "First check-in:" +

          "<br>" +

          result.checkInTime +

          "<br><br>" +

          "<button" +

          " class=\"resultButton\"" +

          " onclick=\"scanNextTicket()\"" +

          ">" +

          "📷 SCAN NEXT TICKET" +

          "</button>";


        return;

      }


      // ========================================
      // INVALID
      // ========================================

      resultBox.className =
        "invalid";


      resultBox.innerHTML =

        "❌ INVALID TICKET" +

        "<br><br>" +

        "<strong>" +

        (
          result.ticketNumber ||
          "UNKNOWN"
        ) +

        "</strong>" +

        "<br><br>" +

        "<button" +

        " class=\"resultButton\"" +

        " onclick=\"scanNextTicket()\"" +

        ">" +

        "📷 TRY AGAIN" +

        "</button>";

    }


    // ==========================================
    // SCAN NEXT TICKET
    // ==========================================

    function scanNextTicket() {


      document.getElementById(
        "result"
      ).className = "waiting";


      document.getElementById(
        "result"
      ).innerHTML =

        "📷 Ready for next ticket.";


      document.getElementById(
        "startButton"
      ).style.display = "block";


      document.getElementById(
        "reader"
      ).innerHTML = "";


      scanner = null;

      scannerRunning = false;

    }


  </script>


</body>

</html>
