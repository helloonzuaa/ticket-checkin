<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Ticket Check-In</title>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border-radius: 12px;

      overflow: hidden;

    }


    #startButton {

      display: block;

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      padding: 16px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

    }


    #result {

      margin: 20px auto;

      padding: 20px;

      max-width: 500px;

      background: white;

      border-radius: 12px;

      font-size: 20px;

    }


    .waiting {

      color: #555;

    }


    .success {

      color: green;

    }


    .error {

      color: red;

    }

  </style>

</head>


<body>


  <h1>🎟️ E-Ticket Check-In</h1>


  <p>

    Scan the QR Code on the E-Ticket

  </p>


  <button id="startButton"
          onclick="startScanner()">

    📷 Start Scanner

  </button>


  <div id="reader"></div>


  <div id="result"
       class="waiting">

    Press "Start Scanner" to begin.

  </div>



  <!-- QR Scanner Library -->

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>



  <script>


    let scanner = null;

    let scannerRunning = false;



    // ==========================================
    // START SCANNER
    // ==========================================

    function startScanner() {


      if (scannerRunning) {

        return;

      }


      document.getElementById("result")
        .className = "waiting";

      document.getElementById("result")
        .innerHTML =
        "Requesting camera access...";


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        function(decodedText) {


          document.getElementById("result")
            .className = "success";


          document.getElementById("result")
            .innerHTML =

            "✅ QR CODE DETECTED" +

            "<br><br>" +

            "<strong>" +

            decodedText +

            "</strong>";


          scannerRunning = false;


          scanner.stop();


        }

      )

      .then(function() {


        scannerRunning = true;


        document.getElementById("startButton")
          .style.display = "none";


        document.getElementById("result")
          .className = "waiting";


        document.getElementById("result")
          .innerHTML =

          "📷 Camera ready." +

          "<br><br>" +

          "Point the camera at the QR Code.";


      })


      .catch(function(error) {


        scannerRunning = false;


        document.getElementById("result")
          .className = "error";


        document.getElementById("result")
          .innerHTML =

          "❌ Unable to access camera." +

          "<br><br>" +

          "<small>" +

          String(error) +

          "</small>";

      });


    }


  </script>


</body>

</html>
